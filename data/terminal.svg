<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Terminal body -->
  <rect x="2" y="2" width="44" height="44" rx="6" fill="#1b2d45"/>
  <!-- Title bar -->
  <rect x="2" y="2" width="44" height="10" rx="6" fill="#2a3f5a"/>
  <rect x="2" y="7" width="44" height="5" fill="#2a3f5a"/>
  <!-- Prompt ">" chevron -->
  <polyline points="7,21 17,28 7,35"
    fill="none" stroke="#5a9fd4" stroke-width="5"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cursor "_" -->
  <line x1="21" y1="35" x2="40" y2="35"
    stroke="#8ec6f0" stroke-width="4" stroke-linecap="round"/>
</svg>
