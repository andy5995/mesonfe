<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Background -->
  <rect x="1" y="1" width="46" height="46" rx="7" fill="#1b2d45"/>

  <!-- Bold M -->
  <polyline points="5,40 5,8 24,25 43,8 43,40"
    fill="none" stroke="#5a9fd4" stroke-width="6.5"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Gear badge: dark backing disc to separate from M -->
  <circle cx="38" cy="38" r="10" fill="#1b2d45"/>

  <!-- Gear body (8-tooth polygon) -->
  <polygon fill="#8ec6f0" points="
    44.5,38  42.44,39.84  42.60,42.60  39.84,42.44
    38,44.5  36.16,42.44  33.40,42.60  33.56,39.84
    31.5,38  33.56,36.16  33.40,33.40  36.16,33.56
    38,31.5  39.84,33.56  42.60,33.40  42.44,36.16"/>

  <!-- Gear hub hole -->
  <circle cx="38" cy="38" r="2.2" fill="#1b2d45"/>
</svg>
