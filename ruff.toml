# Pin the rule set so a new ruff release cannot silently change what CI
# enforces. ruff 0.16.0 raised the default rule set from 59 rules to 413,
# which turned the Lint job red on a commit that touched no Python.
# These four groups are ruff's pre-0.16 defaults, which mesonfe passes.
#
# This defers work rather than removing it. Before widening the list, read
# issue #16 — some of the hidden findings must not be applied mechanically.
[lint]
select = ["E4", "E7", "E9", "F"]
